[HairPositioner]
# Strip the FaceGen base-morph data ("FOD") from adjusted hair meshes so the
# engine cannot rebuild the mesh from the untouched base and undo the offset.
StripMorphData = true

# Worn armor slots whose geometry follows the hair offset (wigs / hair armor).
# Comma separated armor slot numbers. Only used while the RaceMenu slider
# "Hair Move Wig/Helmet Too" is set to 1 -- it is off by default, because
# helmets and hoods use these slots as well.
WigSlots = 31,41
